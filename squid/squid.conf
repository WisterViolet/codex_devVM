# Listen on Codex bridge only
http_port 10.200.200.1:3128

# Codex VM subnet
acl codex_vm src 10.200.200.0/24

# Allowed ports
acl Safe_ports port 80
acl Safe_ports port 443

acl SSL_ports port 443
acl CONNECT method CONNECT

# External domain allowlist
acl allowed_domains dstdomain -n "/etc/squid/codex-allowed-domains.txt"

# Reject unusual destination ports
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Only Codex VM -> allowed domains
http_access allow codex_vm allowed_domains

# Everything else
http_access deny all

# Squid is used as an egress filter, not as a cache.
cache deny all
